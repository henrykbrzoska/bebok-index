# Release pipeline for the bebok-index plugin.
#
# Triggers on a `v*` tag push (or manually through workflow_dispatch, `tag`
# input required in that case). Builds the plugin binary on Windows, Linux
# and macOS, assembles ONE universal engine-installable archive, writes the
# SHA-256 checksum and publishes the GitHub Release with the preinstalled
# `gh` CLI.
#
# Why one universal archive: the Bebok engine registry carries a single
# `asset_url` per plugin (no per-OS templating), so the release must ship
# every platform binary in one package. Layout inside the universal `.zip`
# (every file at the archive ROOT - the engine detects the format from the
# URL suffix only and unpacks zips verbatim):
#   bebok-index.exe    - Windows binary
#   bebok-index        - Linux binary (chmod +x by the entrypoint shim)
#   bebok-index-macos  - macOS binary (chmod +x by the entrypoint shim)
#   bebok-plugin.json  - plugin manifest
#   AGENT_INDEX.md     - agent prompt file
#
# Only first-party actions are used (`actions/checkout`, `actions/upload-…`,
# `actions/download-…`) plus `dtolnay/rust-toolchain@stable`; every other
# step is a plain `run:` step.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v1.6.0). Defaults to the ref name.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve and verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag and version
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          ref="${{ inputs.tag }}"
          if [ -z "$ref" ]; then
            ref="${GITHUB_REF_NAME}"
          fi
          case "$ref" in
            v*) tag="$ref" ;;
            *)
              echo "::error::cannot release from '${ref}' - expected a 'v*' tag (push a tag or pass the tag input)"
              exit 1
              ;;
          esac
          version="${tag#v}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "release tag=${tag} version=${version}"

      - name: Check tag version matches Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.resolve.outputs.version }}"
          cargo_version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*$/\1/p' Cargo.toml | head -n 1)"
          if [ -z "${cargo_version}" ]; then
            echo "::error::could not read 'version' from Cargo.toml"
            exit 1
          fi
          if [ "${version}" != "${cargo_version}" ]; then
            echo "::error::tag version '${version}' does not match Cargo.toml version '${cargo_version}'"
            exit 1
          fi
          manifest_version="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*$/\1/p' bebok-plugin.json | head -n 1)"
          if [ -n "${manifest_version}" ] && [ "${version}" != "${manifest_version}" ]; then
            echo "::error::tag version '${version}' does not match bebok-plugin.json version '${manifest_version}'"
            exit 1
          fi
          echo "version ${version} verified (Cargo.toml ${cargo_version}, bebok-plugin.json ${manifest_version:-n/a})"

  build:
    name: Build (${{ matrix.platform }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win-x64
            binary: target/release/bebok-index.exe
            artifact: binary-win-x64
          - os: ubuntu-latest
            platform: linux-x64
            binary: target/release/bebok-index
            artifact: binary-linux-x64
          - os: macos-latest
            platform: macos-arm64
            binary: target/release/bebok-index
            artifact: binary-macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build (release)
        shell: bash
        run: cargo build --release --bin bebok-index

      - name: Assert plugin binary exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "${{ matrix.binary }}" ]; then
            ls -l "${{ matrix.binary }}"
          else
            echo "::error::no plugin executable at ${{ matrix.binary }} - is the [[bin]] target named 'bebok-index'?"
            exit 1
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 1

  assemble:
    name: Assemble universal asset and publish
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: bins
          merge-multiple: false

      - name: Assemble universal zip
        shell: bash
        run: |
          set -euo pipefail
          version="${VERSION}"
          stage='stage'
          rm -rf "${stage}"
          mkdir -p "${stage}"

          # The engine registry carries ONE asset_url per plugin (no per-OS
          # templating), so all platform binaries ship in this single zip.
          # Filenames differ per OS, so they coexist at the zip root.
          cp 'bins/binary-win-x64/bebok-index.exe' "${stage}/bebok-index.exe"
          cp 'bins/binary-linux-x64/bebok-index' "${stage}/bebok-index"
          cp 'bins/binary-macos-arm64/bebok-index' "${stage}/bebok-index-macos"
          cp bebok-plugin.json "${stage}/bebok-plugin.json"
          if [ -f AGENT_INDEX.md ]; then
            cp AGENT_INDEX.md "${stage}/AGENT_INDEX.md"
          else
            echo '::warning::AGENT_INDEX.md is missing - packaging without it (prompt_file falls back to the engine default)'
          fi

          asset="bebok-index-${version}.zip"
          (cd "${stage}" && zip -9 "../${asset}" ./*)
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "${stage}" && sha256sum "../${asset}" | sed 's| \.\./|  |') > checksums.txt
          else
            (cd "${stage}" && shasum -a 256 "../${asset}" | sed 's| \.\./|  |') > checksums.txt
          fi

          echo "zip entries:"
          unzip -l "${asset}"
          cat checksums.txt

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          version="${VERSION}"
          asset="bebok-index-${version}.zip"

          notes="$(cat <<EOF
          bebok-index ${version}

          Universal plugin archive (SHA-256 in checksums.txt):
          * ${asset} - Windows (bebok-index.exe), Linux (bebok-index) and
            macOS (bebok-index-macos) binaries plus bebok-plugin.json and
            AGENT_INDEX.md, all at the zip root.

          The engine installer verifies the archive SHA-256 and rejects
          symlinks, absolute paths and '..' entries. File modes are not
          preserved on unpack, so the Unix entrypoints chmod the binary
          before exec.
          EOF
          )"

          if gh release create "${tag}" --verify-tag --title "${tag}" --notes "${notes}" "${asset}" checksums.txt; then
            echo "created release ${tag}"
          else
            echo '::warning::release already exists - uploading assets into it instead'
            gh release upload "${tag}" "${asset}" checksums.txt --clobber
          fi
