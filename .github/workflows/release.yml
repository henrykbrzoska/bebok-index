# Release pipeline for the bebok-index plugin.
#
# Triggers on a `v*` tag push (or manually through workflow_dispatch, `tag`
# input required in that case). Builds the plugin binary on Windows, Linux and
# macOS, packages the engine-installable archives, writes SHA-256 checksums and
# publishes the GitHub Release with the preinstalled `gh` CLI.
#
# Archive layout required by the Bebok engine installer (detected from the URL
# suffix only):
#   * `.zip`    -> every file at the archive ROOT, no wrapping directory
#   * `.tar.gz` -> exactly ONE top-level directory, which the engine strips
#
# Only first-party actions are used (`actions/checkout`) plus
# `dtolnay/rust-toolchain@stable`; every other step is a plain `run:` step.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v1.6.0). Defaults to the ref name.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve and verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag and version
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          ref="${{ inputs.tag }}"
          if [ -z "$ref" ]; then
            ref="${GITHUB_REF_NAME}"
          fi
          case "$ref" in
            v*) tag="$ref" ;;
            *)
              echo "::error::cannot release from '${ref}' - expected a 'v*' tag (push a tag or pass the tag input)"
              exit 1
              ;;
          esac
          version="${tag#v}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "release tag=${tag} version=${version}"

      - name: Check tag version matches Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.resolve.outputs.version }}"
          cargo_version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*$/\1/p' Cargo.toml | head -n 1)"
          if [ -z "${cargo_version}" ]; then
            echo "::error::could not read 'version' from Cargo.toml"
            exit 1
          fi
          if [ "${version}" != "${cargo_version}" ]; then
            echo "::error::tag version '${version}' does not match Cargo.toml version '${cargo_version}'"
            exit 1
          fi
          manifest_version="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*$/\1/p' bebok-plugin.json | head -n 1)"
          if [ -n "${manifest_version}" ] && [ "${version}" != "${manifest_version}" ]; then
            echo "::error::tag version '${version}' does not match bebok-plugin.json version '${manifest_version}'"
            exit 1
          fi
          echo "version ${version} verified (Cargo.toml ${cargo_version}, bebok-plugin.json ${manifest_version:-n/a})"

  build:
    name: Build and package (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: macos-arm64
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build (release)
        shell: bash
        run: cargo build --release

      - name: Stage and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:VERSION
          $stage = 'stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # The plugin entrypoint is `bebok-index.exe`; accept the crate name
          # as a fallback so the packaging keeps working if the bin target is
          # named after the package.
          $candidates = @('target/release/bebok-index.exe', 'target/release/bebok-code-index.exe')
          $binary = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $binary) {
            throw "no plugin executable in target/release (looked for: $($candidates -join ', ')) - add a [[bin]] target named 'bebok-index' to Cargo.toml"
          }
          Copy-Item $binary "$stage/bebok-index.exe"
          Copy-Item 'bebok-plugin.json' "$stage/bebok-plugin.json"
          if (Test-Path 'AGENT_INDEX.md') {
            Copy-Item 'AGENT_INDEX.md' "$stage/AGENT_INDEX.md"
          } else {
            Write-Host '::warning::AGENT_INDEX.md is missing - packaging without it (prompt_file falls back to the engine default)'
          }

          # ZIP: bebok-index.exe + bebok-plugin.json + AGENT_INDEX.md at the ROOT.
          $asset = "bebok-index-$version-win-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $asset -Force
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLower()
          [System.IO.File]::WriteAllText('checksums.txt', "$hash  $asset`n", [System.Text.Encoding]::ASCII)

          # Assert the engine's zip layout: every entry at the archive root.
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $asset))
          $names = @($zip.Entries | ForEach-Object { $_.FullName })
          $zip.Dispose()
          $nested = @($names | Where-Object { $_ -like '*/*' -or $_ -like '*\*' })
          if ($nested.Count -gt 0) {
            throw "zip entries must sit at the archive ROOT, found nested: $($nested -join ', ')"
          }
          Write-Host "zip entries: $($names -join ', ')"

          Get-ChildItem $asset | Format-Table Name, Length
          Get-Content 'checksums.txt'

      - name: Stage and package (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${VERSION}"
          platform="${{ matrix.platform }}"
          stage="bebok-index-${version}"
          rm -rf "${stage}"
          mkdir -p "${stage}"

          binary=''
          for candidate in target/release/bebok-index target/release/bebok-code-index; do
            if [ -f "${candidate}" ]; then
              binary="${candidate}"
              break
            fi
          done
          if [ -z "${binary}" ]; then
            echo "::error::no plugin executable in target/release - add a [[bin]] target named 'bebok-index' to Cargo.toml"
            exit 1
          fi

          cp "${binary}" "${stage}/bebok-index"
          chmod 0755 "${stage}/bebok-index"
          cp bebok-plugin.json "${stage}/bebok-plugin.json"
          if [ -f AGENT_INDEX.md ]; then
            cp AGENT_INDEX.md "${stage}/AGENT_INDEX.md"
          else
            echo '::warning::AGENT_INDEX.md is missing - packaging without it (prompt_file falls back to the engine default)'
          fi

          # tar.gz: exactly ONE top-level dir (bebok-index-<version>/), which
          # the engine strips on unpack.
          asset="bebok-index-${version}-${platform}.tar.gz"
          tar -czf "${asset}" "${stage}"

          # Assert the engine's tar.gz layout: exactly one top-level dir, which
          # must be the stage dir the engine strips on unpack.
          tops="$(tar -tzf "${asset}" | sed 's|^\./||' | cut -d/ -f1 | sort -u)"
          if [ "${tops}" != "${stage}" ]; then
            echo "::error::${asset} must wrap everything in exactly one top-level dir '${stage}', got: ${tops}"
            exit 1
          fi
          echo "tar.gz top-level dir: ${tops}"

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${asset}" > checksums.txt
          else
            shasum -a 256 "${asset}" > checksums.txt
          fi
          ls -l "${asset}"
          cat checksums.txt

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          version="${VERSION}"

          assets=()
          for f in "bebok-index-${version}-"*.zip "bebok-index-${version}-"*.tar.gz checksums.txt; do
            if [ -f "$f" ]; then
              assets+=("$f")
            fi
          done
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::no release assets were produced"
            exit 1
          fi
          printf 'assets: %s\n' "${assets[*]}"

          notes="$(cat <<EOF
          bebok-index ${version}

          Pre-built plugin archives (SHA-256 in checksums.txt):
          * Windows x64: bebok-index-${version}-win-x64.zip
          * Linux x64: bebok-index-${version}-linux-x64.tar.gz
          * macOS arm64: bebok-index-${version}-macos-arm64.tar.gz

          The .zip keeps its files at the archive root; each .tar.gz wraps
          everything in a single bebok-index-${version}/ directory. The engine
          installer verifies the archive SHA-256 and rejects symlinks,
          absolute paths and '..' entries. File modes are not preserved on
          unpack, so the Unix entrypoint shim chmods the binary before exec.
          EOF
          )"

          # First job to get here creates the release; the others (and re-runs)
          # upload into the existing release instead.
          if gh release create "${tag}" --verify-tag --title "${tag}" --notes "${notes}" "${assets[@]}"; then
            echo "created release ${tag}"
          else
            echo '::warning::release already exists - uploading assets into it instead'
            gh release upload "${tag}" "${assets[@]}" --clobber
          fi
